services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legalpw
      POSTGRES_DB: legalassistant
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  embeddings:
    build:
      context: ..
      dockerfile: src/LegalAssistant.Embeddings/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:80"

  api:
    build:
      context: ..
      dockerfile: src/LegalAssistant.Api/Dockerfile
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=legalassistant;Username=legal;Password=legalpw
      - UseRabbitMq=true
    ports:
      - "5000:80"

  worker:
    build:
      context: ..
      dockerfile: src/LegalAssistant.Workers/Dockerfile
    depends_on:
      - postgres
      - rabbitmq
      - embeddings
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=legalassistant;Username=legal;Password=legalpw
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - Embeddings__BaseUrl=http://embeddings
    command: dotnet LegalAssistant.Workers.dll

volumes:
  pgdata:
  minio_data:
