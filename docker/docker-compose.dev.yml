services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    ports:
      - "9000:9000"

  ollama:
    ports:
      - "11434:11434"
    mem_limit: 8g

  ollama-init:
    image: ollama/ollama:0.32.5
    depends_on:
      - ollama
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDINGS_MODEL: ${OLLAMA_EMBEDDINGS_MODEL:-nomic-embed-text}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3:8b}
    volumes:
      - ollama:/root/.ollama
      - ./ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    networks:
      - legal-assistant-net

  embeddings:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LOG_PATH: /var/log/myapp/embeddings.log
    ports:
      - "8080:80"
    depends_on:
      - ollama-init
    volumes:
      - ./logs:/var/log/myapp

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LOG_PATH: /var/log/myapp/api.log
      Ollama__TimeoutSeconds: ${OLLAMA_TIMEOUT_SECONDS:-300}
      Authentication__PublicApiBaseUrl: ${AUTH_PUBLIC_API_BASE_URL}
      Authentication__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
      Authentication__Google__CallbackPath: ${AUTH_GOOGLE_CALLBACK_PATH}
      Authentication__Jwt__Issuer: ${AUTH_JWT_ISSUER}
      Authentication__Jwt__Audience: ${AUTH_JWT_AUDIENCE}
      Authentication__Jwt__SigningKey: ${AUTH_JWT_SIGNING_KEY}
      Authentication__Jwt__AccessTokenLifetimeMinutes: ${AUTH_JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      Authentication__RefreshToken__LifetimeDays: ${AUTH_REFRESH_TOKEN_LIFETIME_DAYS}
      Authentication__RefreshToken__CookieName: ${AUTH_REFRESH_TOKEN_COOKIE_NAME}
      Authentication__RefreshToken__RotateOnUse: ${AUTH_REFRESH_TOKEN_ROTATE_ON_USE}
      Authentication__Frontend__SuccessRedirectUrl: ${AUTH_FRONTEND_SUCCESS_REDIRECT_URL}
      Authentication__Frontend__FailureRedirectUrl: ${AUTH_FRONTEND_FAILURE_REDIRECT_URL}
      Authentication__Bootstrap__AdminEmails__0: ${AUTH_BOOTSTRAP_ADMIN_EMAILS}
      Cors__AllowedOrigins__0: ${AUTH_CORS_ALLOWED_ORIGINS}
    ports:
      - "5000:80"
    volumes:
      - ./logs:/var/log/myapp

  worker:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LOG_PATH: /var/log/myapp/workers.log
      Rag__DefaultTopK: ${RAG_DEFAULT_TOPK:-5}
      Rag__MaxTopK: ${RAG_MAX_TOP_K:-20}
      Rag__PromptTokenBudget: ${RAG_PROMPT_TOKEN_BUDGET:-6000}
      Rag__ApproxCharsPerToken: ${RAG_APPROX_CHARS_PER_TOKEN:-4}
      Ollama__TimeoutSeconds: ${OLLAMA_TIMEOUT_SECONDS:-300}
    volumes:
      - ./logs:/var/log/myapp

  frontend:
    ports:
      - "3000:3000"
    environment:
      VITE_PROXY_TARGET: http://api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.3
    user: root
    volumes:
      - ./filebeat:/tmp/filebeat:ro
      - ./logs:/var/log/myapp:ro
    entrypoint:
      - /bin/sh
      - -c
      - cp /tmp/filebeat/filebeat.yml /usr/share/filebeat/filebeat.yml && /usr/local/bin/docker-entrypoint -e
    depends_on:
      - elasticsearch

volumes:
  esdata:
  frontend_node_modules:
