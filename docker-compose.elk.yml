version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - legal-assistant-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - legal-assistant-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.6.3
    container_name: filebeat
    user: root
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/myapp:ro
    depends_on:
      - elasticsearch
    networks:
      - legal-assistant-net

volumes:
  esdata:

networks:
  legal-assistant-net:
    driver: bridge
